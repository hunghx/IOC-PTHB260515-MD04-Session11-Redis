spring:
    application:
        name: redis-app
    datasource:
      url: jdbc:postgresql://localhost:5432/postgres
      username: postgres
      password: 123456$
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update # Tự động cập nhật cấu trúc bảng (update, create, validate, none)
      show-sql: true     # Hiển thị câu lệnh SQL trong console để dễ debug
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
    cache:
      type: redis
    data:
      redis:
        host: localhost
        port: 6379
        connect-timeout: 2000